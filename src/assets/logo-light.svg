<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 214 60" fill="none" role="img" aria-label="Stone Steps 50K">
  <!-- The race's own mark: a hand-painted vintage trail sign. Embedded as a
       data URI so the lockup is a single asset with no extra request.
       NOTE: this is the raster mark. A vector redraw is the proper fix and is
       the outstanding brand job; live type will never reproduce hand lettering,
       so the wordmark beside it is set in the display face rather than trying
       to imitate the mark. -->
  <image href="data:image/png;base64," x="0" y="2" width="34" height="56"/>
  <text x="46" y="26"
    font-family="Staatliches, 'Arial Narrow', system-ui, sans-serif"
    font-size="24" letter-spacing="0.5" fill="#1A1712">STONE STEPS</text>
  <text x="47" y="45"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="11" letter-spacing="3.2" fill="#8F3323">50K · 27K</text>
</svg>
