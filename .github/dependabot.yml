# =============================================================================
# Dependabot — grouped weekly dependency PRs, validated by the existing gates
# =============================================================================
# One PR per week per ecosystem, minor+patch grouped so a Monday merge is one
# green-CI review, not twelve. Majors arrive as their own PRs (Astro, Sanity and
# wrangler majors all have real migration notes on this stack). CI plus the
# Playwright suite are the safety net that makes auto-updates sane solo.
# Mirrors the config proven on presacademy and wcp-website.
# =============================================================================
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/New_York
    # Groups are matched in order, so `formatters` must stay above the
    # catch-all bundle.
    groups:
      # A formatter bump can reformat files and fail format:check (starter
      # PORTS.md card 92). Kept apart so only this small PR goes red, not the
      # whole bundle; fix it with `npm run format` on the branch and push.
      formatters:
        patterns: ['prettier', 'prettier-plugin-*']
        update-types: ['minor', 'patch']
      minor-and-patch:
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 5
    # The Sanity stack (sanity, @sanity/*, react, react-dom) is pinned to exact
    # versions on purpose and moves BY HAND, TOGETHER. Dependabot bumping one
    # member of the set fails `npm ci` with an ERESOLVE against the pinned
    # @sanity/client and takes the whole minor-and-patch group down with it
    # (observed on presacademy, 2026-09-04). The sanity-plugin-* set is pinned
    # for the same reason: those plugins import @sanity/ui/tooltip, which no
    # @sanity/ui 3.x exports.
    ignore:
      - dependency-name: 'sanity'
      - dependency-name: '@sanity/*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'sanity-plugin-*'
      # Added to match the starter's dependabot.yml (PORTS.md card 62): the rest of the
      # pinned React / styled-components set lives outside the @sanity/* namespace.
      - dependency-name: 'react-is'
      - dependency-name: 'styled-components'
      # Adapter and wrangler are pinned as a pair: a lone bump of either can pass
      # `astro build` and still break `wrangler deploy` (starter dependabot.yml).
      - dependency-name: '@astrojs/cloudflare'
      - dependency-name: 'wrangler'
      # Astro moves only with its adapter, by hand (starter PORTS.md card 92).
      # The adapter imports Astro internals: astro 7.3 dropped an export that
      # @astrojs/cloudflare 14.2.4 imports, so a lone astro bump failed the build.
      - dependency-name: 'astro'
      # TypeScript 7 (the native compiler) breaks Astro's tooling; majors only, 6.x flows
      # (vault gotcha typescript-not-7).
      - dependency-name: 'typescript'
        versions: ['>=7']
      # No npm semver-major bumps from Dependabot (starter PR #57, PORTS.md card 62).
      # Majors wait for ONE planned, starter-first stack upgrade (Astro, the adapter,
      # Sanity, wrangler) with a real deploy test. Minors and patches still flow.
      # The github-actions ecosystem below is exempt.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/New_York
    groups:
      actions:
        update-types: ['major', 'minor', 'patch']
