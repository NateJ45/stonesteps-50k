<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Stone Steps 50K">
  <!-- THE STEPS, NOT THE LOGO.
       This used to be the race's full painted mark: four lines of lettering,
       48KB of base64 PNG inside an SVG, shrunk into a 16px tab. Rendered at the
       size a browser actually draws it, "STONE STEPS 50k / Trail Run / and 27k
       Fun Run" is a smudge, and the two smaller lines never resolve at any
       favicon size. A favicon is a MARK, not a signature: it has to be
       recognised, not read.
       So it is the thing the race is named after, as a silhouette. Cream on the
       bark plate, no keyline, four treads, all of it chunky enough to survive
       16px, which was checked at 16, 24, 32 and 64 before it shipped.
       The plate carries its own dark ground on purpose, so the mark reads on a
       light tab strip and a dark one without a second file. -->
  <rect width="64" height="64" rx="11" fill="#1a1712"/>
  <path d="M7 54 V43 H19 V32.5 H31 V22 H43 V11.5 H56 V54 Z" fill="#ffebbb"/>
</svg>
